<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Chess Screen Share</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}.container{background:white;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:40px;width:100%;max-width:500px;text-align:center}h1{color:#333;font-size:28px;margin-bottom:10px}.subtitle{color:#666;margin-bottom:30px;font-size:14px}.status{padding:15px;border-radius:8px;margin-bottom:20px;font-weight:500}.status.idle{background:#f0f0f0;color:#666}.status.sharing{background:#d4edda;color:#155724}.status.error{background:#f8d7da;color:#721c24}.btn{width:100%;padding:16px;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s;margin-bottom:15px}.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}.btn-primary:hover:not(:disabled){transform:translateY(-2px)}.btn-danger{background:#dc3545;color:white}.btn:disabled{opacity:0.5;cursor:not-allowed}.color-select{display:flex;gap:10px;margin-bottom:20px}.color-btn{flex:1;padding:20px;border:3px solid #ddd;border-radius:8px;cursor:pointer;transition:all 0.3s;font-size:16px;font-weight:600}.color-btn.white{background:#fff;color:#333}.color-btn.black{background:#333;color:#fff}.color-btn.selected{border-color:#667eea;box-shadow:0 0 0 2px rgba(102,126,234,0.3)}.share-info{background:#e3f2fd;border-left:4px solid #2196F3;padding:15px;margin:20px 0;border-radius:4px;text-align:left}.share-link{font-family:monospace;font-size:13px;color:#1565C0;word-break:break-all;padding:10px;background:white;border-radius:4px;margin-top:10px}.viewers{margin-top:20px;padding:15px;background:#f8f9fa;border-radius:8px}.viewer-count{font-size:24px;font-weight:bold;color:#667eea}.info-box{background:#fff3cd;border-left:4px solid #ffc107;padding:12px;margin-top:20px;border-radius:4px;font-size:13px;text-align:left;color:#856404}</style></head>
<body><div class="container"><h1>♟️ Chess Screen Share</h1><p class="subtitle">Share your chess game screen</p><div id="status" class="status idle">Not sharing</div><div style="margin-bottom:20px"><strong>Which color are you playing?</strong><div class="color-select"><div class="color-btn white selected" onclick="selectColor('white')">⚪ White</div><div class="color-btn black" onclick="selectColor('black')">⚫ Black</div></div></div><button id="shareBtn" class="btn btn-primary">📺 Start Screen Share</button><button id="stopBtn" class="btn btn-danger" style="display:none">⏹️ Stop Sharing</button><div id="shareInfo" class="share-info" style="display:none"><strong>🔗 Share with your chess bot:</strong><div class="share-link" id="viewLink"></div><button class="btn btn-primary" style="margin-top:10px" onclick="copyLink()">📋 Copy Link</button></div><div id="viewers" class="viewers" style="display:none"><div>👥 Viewers</div><div class="viewer-count" id="viewerCount">0</div></div><div class="info-box">ℹ️ <strong>iOS:</strong> Safari 15.1+ | <strong>Android:</strong> Chrome</div></div>
<script>let ws,mediaStream,sessionId,selectedColor='white';function selectColor(c){selectedColor=c;document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('selected'));document.querySelector('.color-btn.'+c).classList.add('selected')}async function startSharing(){try{status.textContent='Requesting access...';status.className='status idle';mediaStream=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always'},audio:false});sessionId='chess_'+Math.random().toString(36).substr(2,9);const protocol=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${protocol}//${location.host}/share?session=${sessionId}`);ws.binaryType='arraybuffer';ws.onopen=()=>{status.textContent=`✓ Sharing (${selectedColor})`;status.className='status sharing';shareBtn.style.display='none';stopBtn.style.display='block';shareInfo.style.display='block';viewers.style.display='block';viewLink.textContent=`${location.origin}/watch/${sessionId}`;ws.send(JSON.stringify({type:'set_color',color:selectedColor}));startCapture()};ws.onerror=()=>{status.textContent='Connection error';status.className='status error';stopSharing()};ws.onmessage=(e)=>{const d=JSON.parse(e.data);if(d.type==='viewer_count')viewerCount.textContent=d.count};mediaStream.getVideoTracks()[0].onended=()=>stopSharing()}catch(e){status.textContent='Failed: '+e.message;status.className='status error';if(e.name==='NotAllowedError')status.textContent='Access denied. Allow and retry'}}function startCapture(){const video=document.createElement('video');video.srcObject=mediaStream;video.play();const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');function capture(){if(!mediaStream||!ws||ws.readyState!==WebSocket.OPEN)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);canvas.toBlob(b=>{if(b&&ws&&ws.readyState===WebSocket.OPEN)b.arrayBuffer().then(buf=>ws.send(buf))},'image/jpeg',0.75);setTimeout(capture,100)}video.onloadedmetadata=()=>capture()}function stopSharing(){if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null}if(ws){ws.close();ws=null}status.textContent='Not sharing';status.className='status idle';shareBtn.style.display='block';stopBtn.style.display='none';shareInfo.style.display='none';viewers.style.display='none'}function copyLink(){navigator.clipboard.writeText(viewLink.textContent).then(()=>alert('✓ Link copied!'))}shareBtn.addEventListener('click',startSharing);stopBtn.addEventListener('click',stopSharing)</script></body></html>
