<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>View Chess Screen</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;overflow:hidden}.header{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,0.9);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:1000}.title{font-size:18px;font-weight:600}.status{padding:4px 10px;border-radius:12px;background:rgba(255,152,0,0.2);color:#ff9800;font-size:13px}.btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}.container{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;padding-top:50px}#stream{max-width:100%;max-height:calc(100vh - 50px);object-fit:contain;display:none}.message{color:#fff;text-align:center;padding:40px}.message-title{font-size:24px;font-weight:600;margin-bottom:10px}.color-info{margin-top:10px;padding:10px 20px;background:rgba(102,126,234,0.2);border-radius:8px;display:inline-block}</style></head>
<body><div class="header"><div class="title">📺 Chess Screen</div><div><span class="status" id="status">Waiting...</span> <span id="colorInfo" style="margin-left:10px"></span></div><button class="btn" onclick="toggleFullscreen()">Fullscreen</button></div><div class="container"><div id="message" class="message"><div class="message-title">Waiting for screen share...</div><div style="color:#aaa;margin-top:10px">Player needs to start sharing</div></div><canvas id="stream"></canvas></div>
<script>const canvas=document.getElementById('stream');const ctx=canvas.getContext('2d');const message=document.getElementById('message');const status=document.getElementById('status');const colorInfo=document.getElementById('colorInfo');const sessionId=location.pathname.split('/watch/')[1];let playerColor='white';function connect(){const protocol=location.protocol==='https:'?'wss:':'ws:';const ws=new WebSocket(`${protocol}//${location.host}/watch?session=${sessionId}`);ws.binaryType='arraybuffer';ws.onmessage=(e)=>{if(typeof e.data==='string'){const msg=JSON.parse(e.data);if(msg.type==='presenter-connected'){status.textContent='Live';message.style.display='none';canvas.style.display='block';if(msg.pieceColor){playerColor=msg.pieceColor;colorInfo.textContent=`Playing: ${playerColor==='white'?'⚪ White':'⚫ Black'}`}}else if(msg.type==='color_update'){playerColor=msg.color;colorInfo.textContent=`Playing: ${playerColor==='white'?'⚪ White':'⚫ Black'}`}else if(msg.type==='presenter-disconnected'){status.textContent='Waiting';message.style.display='block';canvas.style.display='none'}}else{const blob=new Blob([e.data],{type:'image/jpeg'});const img=new Image();img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(blob)}};ws.onclose=()=>setTimeout(connect,3000)}function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()}connect()</script></body></html>
